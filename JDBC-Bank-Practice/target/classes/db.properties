# ============================================================
# Database Configuration Properties
# In production, these values would be injected via environment
# variables or a secrets manager (e.g., AWS Secrets Manager).
# NEVER commit real credentials to version control.
# ============================================================

# JDBC Connection URL
# useSSL=false        -> Disable SSL for local dev (enable in production)
# serverTimezone=UTC  -> Explicit timezone prevents ambiguity
# allowPublicKeyRetrieval=true -> Required for MySQL 8 caching_sha2_password
db.url=jdbc:mysql://localhost:3306/banking_app?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true

db.username=root
db.password=root

# ============================================================
# HikariCP Connection Pool Settings
# ============================================================

# Maximum number of connections in the pool.
# Rule of thumb: (CPU cores * 2) + effective_spindle_count
hikari.maximumPoolSize=10

# Minimum number of idle connections HikariCP tries to maintain.
hikari.minimumIdle=3

# Maximum milliseconds a client will wait for a connection from the pool.
# If exceeded, HikariCP throws SQLException. (30 seconds)
hikari.connectionTimeout=30000

# Maximum amount of time a connection is allowed to sit idle in the pool.
# (10 minutes)
hikari.idleTimeout=600000

# Maximum lifetime of a connection in the pool.
# Should be shorter than the database's wait_timeout. (30 minutes)
hikari.maxLifetime=1800000

# Threshold for detecting connection leaks.
# If a connection is held longer than this, a warning is logged. (60 seconds)
hikari.leakDetectionThreshold=60000

# Pool name for JMX monitoring and logging
hikari.poolName=BankingHikariPool
