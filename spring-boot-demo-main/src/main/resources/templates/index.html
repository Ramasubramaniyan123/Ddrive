<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Management</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>

        body {
            background-color: #0f172a;
            color: white;
        }

        .card-custom {
            background: #1e293b;
            border-radius: 15px;
            padding: 20px;
        }

        .table {
            color: white;
        }

        .modal-content {
            background: #1e293b;
            color: white;
        }

        .form-control,
        .form-select {
            background: #334155;
            color: white;
            border: none;
        }

        .form-control:focus,
        .form-select:focus {
            background: #334155;
            color: white;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1>User Management</h1>
            <p>Manage users and departments</p>
        </div>

        <div class="d-flex gap-2">

            <a href="/departments"
               class="btn btn-secondary">
                Departments
            </a>

            <button class="btn btn-primary"
                    onclick="openAddModal()">
                Add User
            </button>

        </div>

    </div>

    <!-- SEARCH -->

    <div class="mb-4">

        <input type="text"
               id="searchFilter"
               class="form-control"
               placeholder="Search users">

    </div>

    <!-- TABLE -->

    <div class="card-custom">

        <table class="table table-dark table-hover align-middle">

            <thead>

            <tr>

                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Department</th>
                <th>Status</th>
                <th width="200">Actions</th>

            </tr>

            </thead>

            <tbody id="userTableBody">

            <tr th:each="user : ${users}"
                th:id="'user-row-' + ${user.id}">

                <td th:text="${user.name}"></td>

                <td th:text="${user.email}"></td>

                <td>
                    <span class="badge bg-info"
                          th:text="${user.role}">
                    </span>
                </td>

                <td>
                    <span class="badge bg-warning text-dark"
                          th:text="${user.departmentName}">
                    </span>
                </td>

                <td>

                    <span th:class="${user.active}
                    ? 'badge bg-success'
                    : 'badge bg-secondary'">

                        <span th:text="${user.active}
                        ? 'Active'
                        : 'Inactive'">
                        </span>

                    </span>

                </td>

                <td>

                    <button class="btn btn-sm btn-primary"
                            th:onclick="'openEditModal(' + ${user.id} + ')'">
                        Edit
                    </button>

                    <button class="btn btn-sm btn-warning"
                            th:onclick="'toggleUser(' + ${user.id} + ')'">
                        Toggle
                    </button>

                    <button class="btn btn-sm btn-danger"
                            th:onclick="'deleteUser(' + ${user.id} + ')'">
                        Delete
                    </button>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<!-- MODAL -->

<div class="modal fade"
     id="userModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title"
                    id="modalTitle">
                    Add User
                </h5>

                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <form id="userForm">

                    <input type="hidden"
                           id="userId">

                    <!-- NAME -->

                    <div class="mb-3">

                        <label>Name</label>

                        <input type="text"
                               id="userName"
                               class="form-control"
                               required>

                    </div>

                    <!-- EMAIL -->

                    <div class="mb-3">

                        <label>Email</label>

                        <input type="email"
                               id="userEmail"
                               class="form-control"
                               required>

                    </div>

                    <!-- ROLE -->

                    <div class="mb-3">

                        <label>Role</label>

                        <select id="userRole"
                                class="form-select">

                            <option value="USER">USER</option>
                            <option value="MANAGER">MANAGER</option>
                            <option value="ADMIN">ADMIN</option>

                        </select>

                    </div>

                    <!-- DEPARTMENT -->

                    <div class="mb-3">

                        <label>Department</label>

                        <select id="userDepartment"
                                class="form-select"
                                required>

                            <option value="">
                                Select Department
                            </option>

                            <option th:each="department : ${departments}"
                                    th:value="${department.id}"
                                    th:text="${department.name}">
                            </option>

                        </select>

                    </div>

                    <!-- ACTIVE -->

                    <div class="form-check">

                        <input type="checkbox"
                               class="form-check-input"
                               id="userActive"
                               checked>

                        <label class="form-check-label">
                            Active
                        </label>

                    </div>

                </form>

            </div>

            <div class="modal-footer">

                <button class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Cancel
                </button>

                <button class="btn btn-primary"
                        onclick="saveUser()">
                    Save
                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    const API_BASE = '/api/users';

    const modal =
        new bootstrap.Modal(
            document.getElementById('userModal')
        );

    // OPEN ADD MODAL

    function openAddModal() {

        document.getElementById('userForm').reset();

        document.getElementById('userId').value = '';

        document.getElementById('modalTitle').innerText =
            'Add User';

        modal.show();
    }

    // OPEN EDIT MODAL

    async function openEditModal(id) {

        const response =
            await fetch(`${API_BASE}/${id}`);

        const user =
            await response.json();

        document.getElementById('userId').value =
            user.id;

        document.getElementById('userName').value =
            user.name;

        document.getElementById('userEmail').value =
            user.email;

        document.getElementById('userRole').value =
            user.role;

        document.getElementById('userDepartment').value =
            user.departmentId;

        document.getElementById('userActive').checked =
            user.active;

        document.getElementById('modalTitle').innerText =
            'Edit User';

        modal.show();
    }

    // SAVE USER

    async function saveUser() {

        const id =
            document.getElementById('userId').value;

        const departmentId =
            document.getElementById('userDepartment').value;

        // IMPORTANT VALIDATION

        if (!departmentId) {

            alert('Please select a department');

            return;
        }

        const userData = {

            name:
            document.getElementById('userName').value,

            email:
            document.getElementById('userEmail').value,

            role:
            document.getElementById('userRole').value,

            // IMPORTANT FIX
            departmentId: Number(departmentId),

            active:
            document.getElementById('userActive').checked
        };

        console.log(userData);

        let response;

        if (id) {

            response = await fetch(`${API_BASE}/${id}`, {

                method: 'PUT',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify(userData)
            });

        } else {

            response = await fetch(API_BASE, {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify(userData)
            });
        }

        if (response.ok) {

            location.reload();

        } else {

            const error =
                await response.text();

            console.error(error);

            alert('Failed to save user');
        }
    }

    // TOGGLE USER

    async function toggleUser(id) {

        const response =
            await fetch(`${API_BASE}/${id}/toggle`, {

                method: 'PATCH'
            });

        if (response.ok) {

            location.reload();
        }
    }

    // DELETE USER

    async function deleteUser(id) {

        if (!confirm('Delete this user?')) {
            return;
        }

        const response =
            await fetch(`${API_BASE}/${id}`, {

                method: 'DELETE'
            });

        if (response.ok) {

            location.reload();
        }
    }

    // SEARCH

    document.getElementById('searchFilter')
        .addEventListener('input', function () {

            const term =
                this.value.toLowerCase();

            const rows =
                document.querySelectorAll('#userTableBody tr');

            rows.forEach(row => {

                const text =
                    row.innerText.toLowerCase();

                row.style.display =
                    text.includes(term)
                        ? ''
                        : 'none';
            });
        });

</script>

</body>
</html>
