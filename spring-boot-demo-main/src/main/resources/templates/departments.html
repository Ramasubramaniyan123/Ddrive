<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Department Management</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>

        body {
            background: #0f172a;
            color: white;
        }

        .card-custom {
            background: #1e293b;
            border-radius: 15px;
            padding: 20px;
        }

        .table {
            color: white;
        }

        .modal-content {
            background: #1e293b;
            color: white;
        }

        .form-control {
            background: #334155;
            color: white;
            border: none;
        }

        .form-control:focus {
            background: #334155;
            color: white;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1>Department Management</h1>

            <p>
                Manage departments dynamically
            </p>

        </div>

        <div class="d-flex gap-2">

            <a href="/"
               class="btn btn-secondary">
                Users
            </a>

            <button class="btn btn-primary"
                    onclick="openAddModal()">

                Add Department

            </button>

        </div>

    </div>

    <!-- SEARCH -->

    <div class="mb-4">

        <input type="text"
               id="searchFilter"
               class="form-control"
               placeholder="Search departments">

    </div>

    <!-- TABLE -->

    <div class="card-custom">

        <table class="table table-dark table-hover align-middle">

            <thead>

            <tr>

                <th>Name</th>

                <th>Description</th>

                <th>Status</th>

                <th width="200">
                    Actions
                </th>

            </tr>

            </thead>

            <tbody id="departmentTableBody">

            <tr th:each="department : ${departments}"
                th:id="'department-row-' + ${department.id}">

                <td th:text="${department.name}"></td>

                <td th:text="${department.description}"></td>

                <td>

                    <span th:class="${department.active}
                    ? 'badge bg-success'
                    : 'badge bg-secondary'">

                        <span th:text="${department.active}
                        ? 'Active'
                        : 'Inactive'">
                        </span>

                    </span>

                </td>

                <td>

                    <button class="btn btn-sm btn-primary"
                            th:onclick="'openEditModal(' + ${department.id} + ')'">

                        Edit

                    </button>

                    <button class="btn btn-sm btn-warning"
                            th:onclick="'toggleDepartment(' + ${department.id} + ')'">

                        Toggle

                    </button>

                    <button class="btn btn-sm btn-danger"
                            th:onclick="'deleteDepartment(' + ${department.id} + ')'">

                        Delete

                    </button>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<!-- MODAL -->

<div class="modal fade"
     id="departmentModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title"
                    id="modalTitle">

                    Add Department

                </h5>

                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <form id="departmentForm">

                    <input type="hidden"
                           id="departmentId">

                    <!-- NAME -->

                    <div class="mb-3">

                        <label>Name</label>

                        <input type="text"
                               id="departmentName"
                               class="form-control"
                               required>

                    </div>

                    <!-- DESCRIPTION -->

                    <div class="mb-3">

                        <label>Description</label>

                        <input type="text"
                               id="departmentDescription"
                               class="form-control"
                               required>

                    </div>

                    <!-- ACTIVE -->

                    <div class="form-check">

                        <input type="checkbox"
                               class="form-check-input"
                               id="departmentActive"
                               checked>

                        <label class="form-check-label">

                            Active

                        </label>

                    </div>

                </form>

            </div>

            <div class="modal-footer">

                <button class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Cancel

                </button>

                <button class="btn btn-primary"
                        onclick="saveDepartment()">

                    Save

                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    const API_BASE =
        '/api/departments';

    const modal =
        new bootstrap.Modal(
            document.getElementById('departmentModal')
        );

    // OPEN ADD MODAL

    function openAddModal() {

        document.getElementById('departmentForm').reset();

        document.getElementById('departmentId').value = '';

        document.getElementById('modalTitle').innerText =
            'Add Department';

        modal.show();
    }

    // OPEN EDIT MODAL

    async function openEditModal(id) {

        const response =
            await fetch(`${API_BASE}/${id}`);

        const department =
            await response.json();

        document.getElementById('departmentId').value =
            department.id;

        document.getElementById('departmentName').value =
            department.name;

        document.getElementById('departmentDescription').value =
            department.description;

        document.getElementById('departmentActive').checked =
            department.active;

        document.getElementById('modalTitle').innerText =
            'Edit Department';

        modal.show();
    }

    // SAVE DEPARTMENT

    async function saveDepartment() {

        const id =
            document.getElementById('departmentId').value;

        const departmentData = {

            name:
            document.getElementById('departmentName').value,

            description:
            document.getElementById('departmentDescription').value,

            active:
            document.getElementById('departmentActive').checked
        };

        let response;

        if (id) {

            response = await fetch(`${API_BASE}/${id}`, {

                method: 'PUT',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify(departmentData)
            });

        } else {

            response = await fetch(API_BASE, {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify(departmentData)
            });
        }

        if (response.ok) {

            location.reload();

        } else {

            const error =
                await response.text();

            console.error(error);

            alert('Failed to save department');
        }
    }

    // TOGGLE

    async function toggleDepartment(id) {

        const response =
            await fetch(`${API_BASE}/${id}/toggle`, {

                method: 'PATCH'
            });

        if (response.ok) {

            location.reload();
        }
    }

    // DELETE

    async function deleteDepartment(id) {

        if (!confirm('Delete this department?')) {
            return;
        }

        const response =
            await fetch(`${API_BASE}/${id}`, {

                method: 'DELETE'
            });

        if (response.ok) {

            location.reload();
        }
    }

    // SEARCH

    document.getElementById('searchFilter')
        .addEventListener('input', function () {

            const term =
                this.value.toLowerCase();

            const rows =
                document.querySelectorAll(
                    '#departmentTableBody tr'
                );

            rows.forEach(row => {

                const text =
                    row.innerText.toLowerCase();

                row.style.display =
                    text.includes(term)
                        ? ''
                        : 'none';
            });
        });

</script>

</body>

</html>
